[package]
name = "ctx-memory"
version = "0.2.5"
edition = "2021"
description = "A markdown-backed context graph for agents."
license = "MIT"
repository = "https://github.com/sjawhar/ctx-memory"

[lib]
name = "ctx_memory"
path = "src/lib.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
encoding_rs = "0.8"
fs2 = "0.4"
ignore = "0.4"
jsonschema = { version = "0.60", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
owo-colors = "4"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
toml = "0.8"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[lints.rust]
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
