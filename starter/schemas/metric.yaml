$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - type
  - name
  - value
  - unit
  - as_of
anyOf:
  - required: [quote, source, tier]
  - required: [quotes]
properties:
  type:
    const: metric
  name:
    type: string
    minLength: 1
  value:
    type: [number, string]
  unit:
    type: string
    minLength: 1
  as_of:
    type: string
    format: date
  quote:
    type: string
    minLength: 1
  source:
    type: string
    minLength: 1
  tier:
    $ref: "#/$defs/tier"
  quotes:
    $ref: "#/$defs/quotes"
additionalProperties: true
$defs:
  tier:
    anyOf:
      - type: integer
        enum: [1, 2, 3, 4]
      - type: string
        enum: ["1", "2", "3", "4", external, counterparty, internal, principal, summary, recollection]
  quotes:
    type: array
    minItems: 1
    items:
      type: object
      required: [quote, source, tier]
      properties:
        quote:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        tier:
          $ref: "#/$defs/tier"
      additionalProperties: true
