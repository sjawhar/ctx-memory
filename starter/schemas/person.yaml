$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - type
  - name
  - status
  - quote
  - source
  - tier
properties:
  type:
    const: person
  name:
    type: string
    minLength: 1
  status:
    type: string
    minLength: 1
  quote:
    type: string
    minLength: 1
  source:
    type: string
    minLength: 1
  tier:
    $ref: "#/$defs/tier"
additionalProperties: true
$defs:
  tier:
    anyOf:
      - type: integer
        enum: [1, 2, 3, 4]
      - type: string
        enum: ["1", "2", "3", "4", external, counterparty, internal, principal, summary, recollection]
