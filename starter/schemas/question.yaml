$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - type
  - status
  - question
  - revisit_by
  - quote
  - source
  - tier
properties:
  type:
    const: question
  status:
    enum: [open, answered, deferred, closed, not_found]
  question:
    type: string
    minLength: 1
  revisit_by:
    type: string
    format: date
  quote:
    type: string
    minLength: 1
  source:
    type: string
    minLength: 1
  tier:
    $ref: "#/$defs/tier"
additionalProperties: true
$defs:
  tier:
    anyOf:
      - type: integer
        enum: [1, 2, 3, 4]
      - type: string
        enum: ["1", "2", "3", "4", external, counterparty, internal, principal, summary, recollection]
