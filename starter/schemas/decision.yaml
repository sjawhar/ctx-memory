$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - type
  - status
  - statement
  - revisit_by
anyOf:
  - required: [quote, source, tier]
  - required: [quotes]
properties:
  type:
    const: decision
  status:
    enum: [open, decided, deferred, superseded, closed]
  statement:
    type: string
    minLength: 1
  revisit_by:
    type: string
    format: date
  waiting_on:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  tracked_by:
    type: array
    uniqueItems: true
    items:
      type: string
      format: uri
  quote:
    type: string
    minLength: 1
  source:
    type: string
    minLength: 1
  tier:
    $ref: "#/$defs/tier"
  quotes:
    $ref: "#/$defs/quotes"
additionalProperties: true
$defs:
  tier:
    anyOf:
      - type: integer
        enum: [1, 2, 3, 4]
      - type: string
        enum: ["1", "2", "3", "4", external, counterparty, internal, principal, summary, recollection]
  quotes:
    type: array
    minItems: 1
    items:
      type: object
      required: [quote, source, tier]
      properties:
        quote:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        tier:
          $ref: "#/$defs/tier"
      additionalProperties: true
