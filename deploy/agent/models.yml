# Where the session's model calls go and the credential they carry: the model gateway, never
# Anthropic directly. The image copies this file to
# /opt/ctx-memory/models.yml, and run-cycle.sh writes it, with the job's CTX_MODEL_BASE_URL in
# place of baseUrl's placeholder, to <HOME>/.omp/agent/models.yml as root before every session. omp
# takes a provider's baseUrl as it is written (packages/coding-agent/src/config/model-registry.ts:
# 1806-1828 at the pinned release); only apiKey and header values can name a command or an
# environment variable (config/resolve-config-value.ts:111-115). So the address is written into
# the file, and the session's user can rewrite neither it nor anything else in HOME.
#
# The provider is its own, not omp's built-in anthropic: run-cycle.sh selects
# `gateway/anthropic/claude-opus-5`, which omp splits at the first slash
# (config/model-resolver.ts:708-723), and it sends the model's id as it is listed here as the
# request's model (packages/ai/src/providers/anthropic.ts:5563). The gateway serves only these
# prefixed ids, and this job's key is allowed only these two. The built-in anthropic provider holds
# no key in the session, so no request can reach Anthropic directly. Every call names Opus 5, the
# model run-cycle.sh selects, with one exception: when the gateway refuses Opus 5 to a compaction
# request as an auth failure, omp retries that compaction on the available model with the largest
# context window it has not tried (session/session-maintenance.ts:3503-3509, 3591), which is
# Sonnet 5.5, still through the gateway.
#
# auth: apiKey makes these plain API-key calls: unset, omp sends an anthropic-messages model of a
# custom provider in its Claude Code OAuth shape (config/custom-models.ts:59-64). To an address
# that is not Anthropic's, omp sends the key as `Authorization: Bearer <key>` and no X-Api-Key
# (providers/anthropic.ts:502-514, 4291-4303). compat.replayUnsignedThinking is false as in
# Legion's provider block.
#
# run-cycle.sh writes the key from Secret Manager into the file apiKey names and removes
# ANTHROPIC_API_KEY from the environment before it starts the session, so the key is not
# inherited by `ctx` or any other process the session starts and is not in the session's own
# /proc/<pid>/environ. omp runs this command when a request needs the credential, not when it
# loads the catalog.
providers:
  gateway:
    baseUrl: "@CTX_MODEL_BASE_URL@"
    api: anthropic-messages
    auth: apiKey
    apiKey: "!cat /run/ctx-agent/model-key"
    compat:
      replayUnsignedThinking: false
    models:
      - {id: anthropic/claude-opus-5, name: Claude Opus 5, reasoning: true, input: [text, image], contextWindow: 1000000, maxTokens: 128000, cost: {input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25}}
      - {id: anthropic/claude-sonnet-5-5, name: Claude Sonnet 5.5, reasoning: true, input: [text, image], contextWindow: 1000000, maxTokens: 128000, cost: {input: 2, output: 10, cacheRead: 0.1, cacheWrite: 2.5}}
