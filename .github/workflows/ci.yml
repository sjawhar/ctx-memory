name: ci
# A pull request runs this workflow on its own; the release workflow calls it for the tagged
# commit before it publishes anything.
on: { pull_request: {}, workflow_call: {} }
permissions:
  contents: read

# A newer push to a pull request cancels that pull request's run, waiting or running: every
# sjawhar repository shares one limit of 40 GitHub-hosted jobs at a time. release.yml's call for a
# tag is a group of its own (its run id) and is never cancelled. It must not share the caller's
# group, which would make the call wait for its own caller.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The ingest runner's live probe drives the omp release runner/omp.lock pins, with the
      # SHA-256 it names, and a digest that does not match fails the step. The probe is
      # #[ignore]d in the plain run above, which has no omp. The test that needs root runs in the
      # next step.
      - name: agent cycle live probe (pinned omp)
        run: |
          release="$(sed -n 's/^OMP_RELEASE=//p' runner/omp.lock)"
          digest="$(sed -n 's/^OMP_SHA256_LINUX_X64=//p' runner/omp.lock)"
          test -n "$release" && test -n "$digest"
          curl -fsSLo "$RUNNER_TEMP/omp.tar.gz" \
            "https://github.com/sjawhar/oh-my-pi/releases/download/${release}/omp-${release}-linux-x64.tar.gz"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/omp.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/omp"
          tar -xzf "$RUNNER_TEMP/omp.tar.gz" -C "$RUNNER_TEMP/omp" --strip-components=2 --no-same-owner
          CTX_TEST_OMP="$RUNNER_TEMP/omp/omp" cargo test --test agent_cycle -- --ignored --skip as_root
      # run-cycle.sh checks, as ctx-agent, that the session can read every window after the
      # marker. Only a real second user makes that check the kernel's, so this test runs as root,
      # which makes ctx-agent and hands the session to it; the plain run above skips it
      # (#[ignore]). sudo drops CI=true, so the runner names this machine a throwaway one itself.
      - name: agent cycle as root, with a real second user
        run: |
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="sudo -E env CTX_TEST_THROWAWAY_MACHINE=1 $PWD/scripts/test-runner" \
            cargo test --test agent_cycle -- --ignored as_root
      # The starter tree is what a new tree is copied from, so it must pass both checks its own
      # rules page asks for: the sweep, and cite verify, which exits 1 on a claim it cannot check.
      - run: cargo run -- --memory starter sweep
      - run: cargo run -- --memory starter cite verify
      # The ingest runner ships a shell script, and what it does with the model key and the
      # session's privileges is security-relevant, so it is checked like the Rust is.
      - run: shellcheck runner/run-cycle.sh scripts/test-runner
