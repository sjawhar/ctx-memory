name: ci
# A pull request runs this workflow on its own; the release workflow calls it for the tagged
# commit before it publishes anything.
on: { pull_request: {}, workflow_call: {} }
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The ingest runner's live probe drives the omp release runner/omp.lock pins, with the
      # SHA-256 it names, and a digest that does not match fails the step. The probe is
      # #[ignore]d in the plain run above, which has no omp.
      - name: agent cycle live probe (pinned omp)
        run: |
          release="$(sed -n 's/^OMP_RELEASE=//p' runner/omp.lock)"
          digest="$(sed -n 's/^OMP_SHA256_LINUX_X64=//p' runner/omp.lock)"
          test -n "$release" && test -n "$digest"
          curl -fsSLo "$RUNNER_TEMP/omp.tar.gz" \
            "https://github.com/sjawhar/oh-my-pi/releases/download/${release}/omp-${release}-linux-x64.tar.gz"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/omp.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/omp"
          tar -xzf "$RUNNER_TEMP/omp.tar.gz" -C "$RUNNER_TEMP/omp" --strip-components=2 --no-same-owner
          CTX_TEST_OMP="$RUNNER_TEMP/omp/omp" cargo test --test agent_cycle -- --ignored
      # The starter tree is what a new tree is copied from, so it must pass both checks its own
      # rules page asks for: the sweep, and cite verify, which exits 1 on a claim it cannot check.
      - run: cargo run -- --memory starter sweep
      - run: cargo run -- --memory starter cite verify
      # The ingest runner ships a shell script, and what it does with the model key and the
      # session's privileges is security-relevant, so it is checked like the Rust is.
      - run: shellcheck runner/run-cycle.sh
